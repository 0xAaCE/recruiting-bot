apiVersion: apps/v1
kind: Deployment
metadata:
    name: recruiting-bot-server
    namespace: recruiting-bot
    labels:
        app: recruiting-bot-server
spec:
    replicas: 0
    selector:
        matchLabels:
            app: recruiting-bot-server
    template:
        metadata:
            labels:
                app: recruiting-bot-server
        spec:
            containers:
                - name: server
                  image: xaace/recruiting-bot-server:latest
                  ports:
                      - containerPort: 3001
                  envFrom:
                      - secretRef:
                            name: recruiting-bot-secrets
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3001
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 3001
                      initialDelaySeconds: 10
                      periodSeconds: 30
